name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build guarded snapshots and app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
          VITE_GADS_ID: ${{ secrets.VITE_GADS_ID }}
          VITE_GADS_CONVERSION_LABEL: ${{ secrets.VITE_GADS_CONVERSION_LABEL }}
          VITE_GADS_PURCHASE_LABEL: ${{ secrets.VITE_GADS_PURCHASE_LABEL }}
          REQUIRE_PAGE_SYNC: ${{ github.event_name == 'push' && '1' || '0' }}
          REQUIRE_PAGE_SYNC_MANIFEST: ${{ github.event_name == 'push' && '1' || '0' }}
          REQUIRE_SNAPSHOT_MANIFEST: '1'
        run: npm run build

      - name: Validate FAQ JSON-LD equality
        run: |
          node ci/validate-faq-jsonld.js
          node scripts/validate-faq-parity.cjs

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Start preview server (serve dist)
        run: |
          nohup npx serve -s dist -l 4173 >/dev/null 2>&1 &
          sleep 3

      - name: Prerender critical routes to static HTML
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:4173
          PRERENDER_OUT_DIR: public/prerendered
          PRERENDER_CONTENT_ROUTES: '0'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/prerender-all.js

      - name: Validate all prerendered HTML guardrails
        env:
          VALIDATE_ALL_PRERENDERED: '1'
        run: |
          node scripts/validate-snapshot-guardrails.cjs
          node scripts/validate-blog-snapshot-guardrails.mjs

      - name: Copy prerendered snapshots into dist
        env:
          REQUIRE_SNAPSHOT_MANIFEST: '1'
        run: node scripts/copy-prerendered.js

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fabsy --branch=main
