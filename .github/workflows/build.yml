name: Build and optional frontend deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy the built frontend after backend-first verification'
        required: true
        default: false
        type: boolean
      backend_release_commit:
        description: 'Exact 40-character commit already proven backend-ready'
        required: false
        type: string
      backend_first_confirmation:
        description: 'Type BACKEND_READY_FRONTEND_LAST to permit deployment'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Validate paid-acquisition launch-control schema and adversarial cases
        run: |
          npm run test:ads-readiness
          npm run ci:ads-readiness

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check paid-acquisition Edge Functions
        run: |
          deno check --node-modules-dir=none --frozen \
            supabase/functions/_shared/meta-capi.ts \
            supabase/functions/_shared/meta-purchase.ts \
            supabase/functions/cache-ticket-data/index.ts \
            supabase/functions/create-payment/index.ts \
            supabase/functions/idr-payment-webhook/index.ts \
            supabase/functions/meta-capi-worker/index.ts \
            supabase/functions/ticket-intake-draft/index.ts \
            supabase/functions/submit-ticket/index.ts \
            supabase/functions/cleanup-ticket-intake-drafts/index.ts \
            supabase/functions/record-funnel-event/index.ts \
            supabase/functions/paid-funnel-report/index.ts \
            supabase/functions/send-notification/index.ts \
            supabase/functions/withdraw-meta-measurement/index.ts
      
      - name: Build guarded snapshots and app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MEASUREMENT_ENABLED: ${{ vars.VITE_GOOGLE_MEASUREMENT_ENABLED }}
          VITE_META_MEASUREMENT_ENABLED: ${{ vars.VITE_META_MEASUREMENT_ENABLED }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_GA4_MEASUREMENT_ID: G-26G8CMWTKY
          VITE_GADS_ID: ${{ secrets.VITE_GADS_ID }}
          VITE_GADS_CONVERSION_LABEL: ${{ secrets.VITE_GADS_CONVERSION_LABEL }}
          VITE_GADS_PURCHASE_LABEL: ${{ secrets.VITE_GADS_PURCHASE_LABEL }}
          VITE_GADS_PHOTO_RADAR_PURCHASE_LABEL: ${{ secrets.VITE_GADS_PHOTO_RADAR_PURCHASE_LABEL }}
          REQUIRE_BROWSER_SUPABASE_CONFIG: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_frontend == true && '1' || '0' }}
          REQUIRE_PAGE_SYNC: ${{ github.event_name == 'push' && '1' || '0' }}
          REQUIRE_PAGE_SYNC_MANIFEST: ${{ github.event_name == 'push' && '1' || '0' }}
          REQUIRE_SNAPSHOT_MANIFEST: '1'
        run: npm run build

      - name: Validate FAQ JSON-LD equality
        run: |
          node ci/validate-faq-jsonld.js
          node scripts/validate-faq-parity.cjs

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Verify private document navigation in Chromium
        run: node scripts/test-measurement-navigation-browser.mjs

      - name: Verify enabled measurement with inert Google fixtures
        if: github.ref == 'refs/heads/main' && vars.VITE_GOOGLE_MEASUREMENT_ENABLED == 'true'
        run: node scripts/test-google-measurement-network.mjs --offline --pending-navigation-guardian --artifact-dir "${{ runner.temp }}/fabsy-google-measurement"

      - name: Start preview server (serve dist)
        run: |
          nohup npx serve -s dist -l 4173 >/dev/null 2>&1 &
          sleep 3

      - name: Verify reviewed content parity in Chromium
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:4173
        run: node scripts/test-curated-content-browser.mjs

      - name: Prerender critical routes to static HTML
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:4173
          PRERENDER_OUT_DIR: public/prerendered
          PRERENDER_CONTENT_ROUTES: '0'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/prerender-all.js

      - name: Validate all prerendered HTML guardrails
        env:
          VALIDATE_ALL_PRERENDERED: '1'
        run: |
          node scripts/validate-snapshot-guardrails.cjs
          node scripts/validate-blog-snapshot-guardrails.mjs
          node scripts/validate-blog-snapshot-uniqueness.mjs

      - name: Copy prerendered snapshots into dist
        env:
          REQUIRE_SNAPSHOT_MANIFEST: '1'
        run: node scripts/copy-prerendered.js

      - name: Verify backend-first frontend deployment gate
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_frontend == true
        env:
          REQUESTED_COMMIT: ${{ inputs.backend_release_commit }}
          CONFIRMATION: ${{ inputs.backend_first_confirmation }}
          PINNED_DEPLOYABLE_COMMIT: ${{ vars.FABSY_FRONTEND_DEPLOY_COMMIT }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMIT" = "$GITHUB_SHA"
          test "$PINNED_DEPLOYABLE_COMMIT" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "BACKEND_READY_FRONTEND_LAST"

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_frontend == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fabsy --branch=main

      - name: Submit changed URLs to IndexNow
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_frontend == true
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs --from "${{ github.event.before }}" --to WORKTREE
