name: AnderHue browser compatibility

on:
  pull_request:
    paths:
      - 'src/anderhue/**'
      - 'src/anderhue*.tsx'
      - 'src/styles/anderhue-app.css'
      - 'src/index.css'
      - 'ontario/anderhue-paralegal-site/**'
      - 'scripts/anderhue-qa/**'
      - 'scripts/*anderhue*'
      - 'vite.anderhue.config.ts'
      - 'package*.json'
      - '.github/workflows/anderhue-browsers.yml'
  push:
    branches: [main]
    paths:
      - 'src/anderhue/**'
      - 'src/anderhue*.tsx'
      - 'src/styles/anderhue-app.css'
      - 'src/index.css'
      - 'ontario/anderhue-paralegal-site/**'
      - 'scripts/anderhue-qa/**'
      - 'scripts/*anderhue*'
      - 'vite.anderhue.config.ts'
      - 'package*.json'
      - '.github/workflows/anderhue-browsers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anderhue-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-latest
          - browser: chrome
            os: ubuntu-latest
          - browser: msedge
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser
        shell: bash
        run: |
          if [ "${{ matrix.browser }}" = chrome ] && command -v google-chrome >/dev/null 2>&1; then
            # GitHub's Ubuntu runner already has branded Chrome. Reinstalling
            # it can stall on the external apt repository; the browser test
            # prints the actual installed version it launches.
            google-chrome --version
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Build and verify public, client and staff flows
        run: npm run verify:anderhue
        env:
          AH_QA_BROWSER: ${{ matrix.browser }}
