name: Prerender refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: [ main ]
    paths-ignore:
      - 'public/prerendered/**'
      - 'public/sitemap.xml'
      - 'public/sitemaps/**'
      - 'src/content/pages/**'
      - 'src/content/page-sync-manifest.json'
      - 'src/content/routes-manifest.json'
concurrency:
  group: prerender-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prerender:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check measurement Edge Functions
        run: |
          deno check \
            supabase/functions/_shared/meta-capi.ts \
            supabase/functions/_shared/meta-purchase.ts \
            supabase/functions/create-payment/index.ts \
            supabase/functions/idr-payment-webhook/index.ts \
            supabase/functions/meta-capi-worker/index.ts \
            supabase/functions/withdraw-meta-measurement/index.ts
      - name: Build guarded snapshots and app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MEASUREMENT_ENABLED: ${{ vars.VITE_GOOGLE_MEASUREMENT_ENABLED }}
          VITE_META_MEASUREMENT_ENABLED: ${{ vars.VITE_META_MEASUREMENT_ENABLED }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_GA4_MEASUREMENT_ID: G-26G8CMWTKY
          VITE_GADS_ID: ${{ secrets.VITE_GADS_ID }}
          VITE_GADS_CONVERSION_LABEL: ${{ secrets.VITE_GADS_CONVERSION_LABEL }}
          VITE_GADS_PURCHASE_LABEL: ${{ secrets.VITE_GADS_PURCHASE_LABEL }}
          VITE_GADS_PHOTO_RADAR_PURCHASE_LABEL: ${{ secrets.VITE_GADS_PHOTO_RADAR_PURCHASE_LABEL }}
          REQUIRE_PAGE_SYNC: '1'
          REQUIRE_PAGE_SYNC_MANIFEST: '1'
          REQUIRE_SNAPSHOT_MANIFEST: '1'
        run: npm run build
      - run: node ci/validate-faq-jsonld.js
      - run: node scripts/validate-faq-parity.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify private document navigation in Chromium
        run: node scripts/test-measurement-navigation-browser.mjs

      - name: Verify enabled measurement with inert Google fixtures
        if: github.ref == 'refs/heads/main' && vars.VITE_GOOGLE_MEASUREMENT_ENABLED == 'true'
        run: node scripts/test-google-measurement-network.mjs --offline --pending-navigation-guardian --artifact-dir "${{ runner.temp }}/fabsy-google-measurement"

      - name: Serve dist
        run: nohup npx serve -s dist -l 4173 >/dev/null 2>&1 & sleep 3
      - name: Verify reviewed content parity in Chromium
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:4173
        run: node scripts/test-curated-content-browser.mjs
      - name: Prerender to static HTML
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:4173
          PRERENDER_OUT_DIR: public/prerendered
          PRERENDER_CONTENT_ROUTES: '0'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/prerender-all.js
      - name: Validate all prerendered HTML guardrails
        env:
          VALIDATE_ALL_PRERENDERED: '1'
        run: |
          node scripts/validate-snapshot-guardrails.cjs
          node scripts/validate-blog-snapshot-guardrails.mjs
          node scripts/validate-blog-snapshot-uniqueness.mjs
      - name: Copy refreshed snapshots into dist
        env:
          REQUIRE_SNAPSHOT_MANIFEST: '1'
        run: node scripts/copy-prerendered.js
      - name: Commit refreshed snapshots
        run: |
          git config user.name  "fabsy-ci"
          git config user.email "ci@fabsy.ca"
          git add -- \
            public/prerendered \
            public/sitemap.xml \
            public/sitemaps \
            src/content/pages \
            src/content/page-sync-manifest.json \
            src/content/routes-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "ci: refresh generated crawler snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy scheduled or requested refresh to Cloudflare Pages
        if: github.event_name != 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fabsy --branch=main
      - name: Submit refreshed URLs to IndexNow
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs --from "${{ github.sha }}" --to HEAD
