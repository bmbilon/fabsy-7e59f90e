name: Vapi recording compatibility checks
on:
  pull_request:
    paths:
      - 'supabase/functions/vapi-call-webhook/**'
      - 'supabase/functions/_shared/resend-email.ts'
      - 'scripts/test-vapi-recording-webhook.mjs'
      - '.github/workflows/vapi-recordings.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/vapi-call-webhook/**'
      - 'supabase/functions/_shared/resend-email.ts'
      - 'scripts/test-vapi-recording-webhook.mjs'
      - '.github/workflows/vapi-recordings.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify authenticated recording fetch without network permission
        run: deno test --no-config --no-npm supabase/functions/vapi-call-webhook/recording.test.ts
      - name: Verify real webhook with local provider mocks only
        run: node scripts/test-vapi-recording-webhook.mjs
